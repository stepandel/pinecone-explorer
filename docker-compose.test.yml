services:
  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: pinecone-explorer-test-qdrant
    ports:
      - '6333:6333' # HTTP API
      - '6334:6334' # gRPC API
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ['CMD-SHELL', 'timeout 1 bash -c "</dev/tcp/localhost/6333" || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - test-network

  # Weaviate vector database
  weaviate:
    image: semitechnologies/weaviate:1.28.11
    container_name: pinecone-explorer-test-weaviate
    ports:
      - '8080:8080'
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=none
      - CLUSTER_HOSTNAME=node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ['CMD-SHELL', 'timeout 1 bash -c "</dev/tcp/localhost/8080" || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - test-network

  # Redis as Pinecone placeholder (for infrastructure testing)
  # Note: This is NOT a Pinecone emulator, just a placeholder service
  # For real Pinecone testing, use actual Pinecone cloud API
  redis-pinecone-placeholder:
    image: redis:7-alpine
    container_name: pinecone-explorer-test-redis
    ports:
      - '5080:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - test-network

volumes:
  qdrant_data:
    driver: local
  weaviate_data:
    driver: local

networks:
  test-network:
    driver: bridge
